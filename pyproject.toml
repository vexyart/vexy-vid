[build-system]
requires = [
    'hatchling>=1.27',
    'hatch-vcs>=0.3.0',
]
build-backend = 'hatchling.build'

[project]
name = 'vexy-vid'
dynamic = ['version']
description = 'High-performance video cropping and trimming CLI tool with automatic detection'
readme = 'README.md'
license = 'Apache-2.0'
license-files = ['LICENSE']
requires-python = '>=3.10'
keywords = [
    'video',
    'crop',
    'trim',
    'ffmpeg',
    'cli',
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Multimedia :: Video',
    'Topic :: Multimedia :: Video :: Conversion',
]
dependencies = [
    'fire',
    'ffmpeg-python>=0.2.0',
    'rich>=13.0.0',
    'loguru>=0.7.0',
    'opencv-python>=4.9.0',
    'numpy>=1.26.0',
    'numba>=0.59.0',
    'av>=12.0.0',
    'psutil>=5.9.0',
]

[[project.authors]]
name = 'Fontlab Ltd.'
email = 'support@fontlab.com'

[project.optional-dependencies]
dev = [
    'pytest>=8.0.0',
    'pytest-cov>=5.0.0',
    'ruff>=0.6.0',
]

[project.scripts]
vexy-vid = 'vexy_vid.cli:main'

[project.urls]
Homepage = 'https://github.com/vexyart/vexy-vid'
Repository = 'https://github.com/vexyart/vexy-vid'
Issues = 'https://github.com/vexyart/vexy-vid/issues'
[tool.hatch.version]
source = 'vcs'

[tool.hatch.version.raw-options]
version_scheme = 'no-guess-dev'
local_scheme = 'no-local-version'
fallback_version = '0.0.1'
[tool.hatch.build.hooks.vcs]
version-file = 'src/vexy_vid/_version.py'
[tool.hatch.build.targets.wheel]
packages = ['src/vexy_vid']

[tool.hatch.build.targets.sdist]
include = [
    '/src/vexy_vid',
    '/README.md',
    '/LICENSE',
    '/pyproject.toml',
]

[tool.ruff]
line-length = 100
target-version = 'py310'

[tool.ruff.lint]
select = [
    'E',
    'F',
    'I',
    'N',
    'W',
]

[tool.ruff.lint.per-file-ignores]
# CLI flags are intentionally capitalized so `fire` exposes --Halign / --Valign
# / --Letterbox to users; renaming them would break the documented interface.
'src/vexy_vid/crop.py' = ['N803']
'src/vexy_vid/trim.py' = ['N803']
# QUALITY_LABELS is a local lookup constant, not a mutable variable.
'src/vexy_vid/encoder.py' = ['N806']

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
addopts = '-ra -q'

[tool.coverage.run]
source = ['src/vexy_vid']
omit = ['*/_version.py']

[tool.hatch.envs.hatch-test]
extra-dependencies = [
    'pytest-cov>=5.0.0',
]
